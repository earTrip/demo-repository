# 빌드·테스트 자동 검증 (소스관리 단계) — PR/push마다 실행
name: CI
on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test          # 지오펜스 트래커 단위 테스트
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm test          # courseStore 잠금 씬/완주 판정 (네이티브 계층은 목킹)

  backend-eartrip:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend/ear-trip-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B verify     # 결제 confirm 단위 테스트 포함
